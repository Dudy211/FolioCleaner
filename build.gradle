plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = project.version
group = project.group

base {
    // 产物文件名跟产品名走（mod id 是历史值，见 gradle.properties 注释）
    archivesName = "foliocleaner-forge-${minecraft_version}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

mixin {
    // 文件名跟包名/产品名走（mod id 仍是历史值 jeicleaner，不能改）
    add sourceSets.main, "foliocleaner.refmap.json"
    config "foliocleaner.mixins.json"
}

repositories {
    maven { name = 'Aliyun'; url = 'https://maven.aliyun.com/repository/public' }
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI：编译期依赖（运行期由玩家安装的 JEI 提供）
    compileOnly fileTree(dir: 'compile_only_depend', includes: ['*.jar'])

    // LuaJ（Lua 适配器引擎）：跟着我们的 jar 一起发（shade 进去，见下面的 jar 块）
    implementation files('libs/luaj-jse-3.0.1.jar')

    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor files('mixin-libs/mixin-processor.jar')
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 不设 UTF-8 的话 mods.toml 里的中文描述会变成乱码
    filteringCharset = 'UTF-8'

    var expandProps = [
            'version'                   : version,
            'group'                     : project.group,
            'minecraft_version'         : minecraft_version,
            'minecraft_version_range'   : minecraft_version_range,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'description'               : project.description,
            'forge_version'             : forge_version,
            'forge_loader_version_range': forge_loader_version_range,
            'java_version'              : java_version
    ]
    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

jar {
    // 把 LuaJ 的类摊平进我们的 jar（它没有 META-INF 签名，安全）
    from(zipTree('libs/luaj-jse-3.0.1.jar')) {
        exclude 'META-INF/**'
        exclude 'javax/**'
    }
    manifest {
        attributes([
                // ★必须是磁盘上真实的配置文件名（mod id 是历史值 jeicleaner，不能拿来拼）
                'MixinConfigs'          : "foliocleaner.mixins.json",
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
