modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
description='''洁册灵 · Folio Cleaner
按物品 / 模组 / 配方 ID / 分类隐藏或删除配方，支持限定工作台类型、重复物品归并、引用排行统计。
配方级隐藏：JEI 与 REI 实时生效，EMI 在初始化期生效（改规则需重开游戏）。
图形界面：/foliocleaner（短别名 /folio）。'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="CLIENT"
